    <!-- PWA & Mobile Web App Meta -->
    <script>
      // In AI Studio iframe environment, HMR is disabled. Handle Vite HMR connection cleanly.
      (function() {
        const OrigWebSocket = window.WebSocket;
        if (!OrigWebSocket) return;
        class SafeWebSocket extends EventTarget {
          constructor(url, protocols) {
            super();
            if (protocols === 'vite-hmr' || protocols === 'vite-ping' || (typeof url === 'string' && url.includes('token='))) {
              this.url = url;
              this.readyState = 1; // OPEN
              this.onopen = null;
              this.onclose = null;
              this.onerror = null;
              this.onmessage = null;
              setTimeout(() => {
                const event = new Event('open');
                if (typeof this.onopen === 'function') this.onopen(event);
                this.dispatchEvent(event);
              }, 0);
            } else {
              return new OrigWebSocket(url, protocols);
            }
          }
          send() {}
          close() {
            this.readyState = 3;
            const event = new CloseEvent('close', { code: 1000, reason: 'Normal' });
            if (typeof this.onclose === 'function') this.onclose(event);
            this.dispatchEvent(event);
          }
        }
        SafeWebSocket.CONNECTING = 0;
        SafeWebSocket.OPEN = 1;
        SafeWebSocket.CLOSING = 2;
        SafeWebSocket.CLOSED = 3;
        window.WebSocket = SafeWebSocket;
      })();
    </script>
    <meta name="theme-color" content="#000000" />

    <!-- MathJax 3 Configuration -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        svg: {
          fontCache: 'global'
        },
        options: {
          enableMenu: false
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
