[build]
  command = "npm run build"
  publish = "dist"

# SPA client-side routing fallback (real static files like /sw.js, /assets/*, and PWA icons are served first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Allow Firebase Google Sign-In popup communication and enforce clean security headers
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Ensure PWA Service Worker & manifest always revalidate on updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-lived immutable cache for fingerprinted Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
